---
# =========================================================================
# 60-verify.yml — end-to-end verification of the SO deploy
# =========================================================================
# Cheap checks: so-status on manager, /_cluster/health on search,
# suricata + zeek running on sensor, GRE tunnel up on both ends, packets
# flowing (tcpdump packet count > 0 in a 5-sec window on sensor's tun0).
#
# Actual pass/fail thresholds + output formatting live in verify_so.sh
# (top-level script) which this playbook invokes as its final check.
# =========================================================================

- name: SO manager status
  hosts: so_manager
  become: true
  gather_facts: false
  tasks:
    - name: so-status
      ansible.builtin.command: sudo so-status
      changed_when: false
      register: so_status_out
    - name: report
      ansible.builtin.debug:
        msg: "{{ so_status_out.stdout_lines[-20:] }}"

- name: Elastic cluster health (query from manager; so-elasticsearch-query is manager-only, and cluster health is a whole-cluster metric anyway)
  hosts: so_manager
  become: true
  gather_facts: false
  tasks:
    - name: elastic cluster health
      ansible.builtin.command: sudo so-elasticsearch-query _cluster/health?pretty
      changed_when: false
      register: es_health_out
    - name: report
      ansible.builtin.debug:
        msg: "{{ es_health_out.stdout }}"

# Every sensor gets its own end-to-end proof. Traffic targets live in each
# sensor's host_vars as `so_verify_mirror_targets`, because which addresses
# force a router to forward out a MIRRORED interface is a per-router fact.
#
# Coverage is deliberately partial and that is fine: each sensor's targets
# exercise one or two of its router's mirrored interfaces, which is enough to
# prove the whole chain (tc mirred -> GRE encap -> route to sensor -> firewall
# -> kernel decap -> tun0). It does NOT prove every mirrored interface on
# every router. Do not read a pass as full coverage.
- name: SO sensor pcap flow rate — all three sensors
  hosts: so_sensor
  become: true
  gather_facts: false
  tasks:
    # On an idle range a passive tcpdump reports 0 packets even though the
    # GRE mirror is fully functional -- which is exactly what so_sensor's
    # inline check reports at install time. Generate a burst of ICMP first.
    #
    # BUG FIXED 2026-07-29: this previously pinged the .1 GATEWAY IPs, which
    # generates NO mirrorable traffic at all. Those are the router's own
    # addresses, so packets are locally delivered on the interface they
    # arrive on and never egress a mirrored interface, where the
    # `tc ... action mirred egress mirror` rules live. The check reported
    # "0 packets captured" against a perfectly working mirror and masked a
    # real GRE firewall bug for several deploy cycles. See PORTING_GUIDE 9.10.
    #
    # Targets must be addresses ON a mirrored subnet. Unresponsive targets are
    # fine -- the router still ARPs out that interface and ARP frames are
    # mirrored too (confirmed: gre-proto-0x806 seen encapsulated on the wire).
    - name: Fail early if this sensor has no mirror targets defined
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} has no so_verify_mirror_targets in host_vars.
          Without targets the tcpdump below would report 0 packets and fail for
          the wrong reason. Add addresses that sit ON one of this sensor's
          mirrored subnets -- never a router's own .1 address.
      when: so_verify_mirror_targets | default([]) | length == 0

    - name: Generate mirror-able traffic toward this sensor's subnets (background)
      ansible.builtin.shell: |
        for tgt in {{ so_verify_mirror_targets | join(' ') }}; do
          ping -c 10 -i 0.5 -W 1 -q -n "$tgt" &
        done
        wait
      delegate_to: "{{ groups['so_manager'][0] }}"
      async: 30
      poll: 0
      changed_when: false
      register: traffic_gen

    - name: 15-sec tcpdump on monitor interface — packet count > 0 means GRE mirror is delivering
      ansible.builtin.shell: |
        timeout 15 tcpdump -i {{ so_monitor_interface }} -c 100 -nn 2>&1 | tail -5
      changed_when: false
      register: pcap_out
      # EXACT LINE match, never a substring. tcpdump prints "100 packets
      # captured", and `'0 packets captured' in stdout` is TRUE for that
      # string -- so the substring form failed precisely when the mirror was
      # WORKING (PowerPlant 2026-08-04, all three sensors at 100 packets).
      # stdout_lines membership is an equality test per line and cannot do
      # that. See UPSTREAM_FIXES 2026-08-04 (later 4).
      failed_when: "'0 packets captured' in pcap_out.stdout_lines"

    - name: report
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} via {{ so_verify_mirror_targets | join(', ') }}: {{ pcap_out.stdout }}"

    # PACKETS ARRIVING IS NOT THE OUTCOME. It is the transport.
    #
    # Every check above this line passed for 42 hours while Zeek produced 66
    # connection records in its entire lifetime and 23.5M packets arrived.
    # The mirror was perfect; AF_PACKET could not parse an L3 gre tunnel's
    # cooked frames and discarded 100% of them. Suricata reads cooked capture
    # natively, so alerting worked and nothing looked wrong.
    #
    # Zeek's own counter is the honest signal -- it reports what it RECEIVED
    # versus what it PROCESSED, and a high "not processed" percentage is the
    # exact fingerprint of a capture/link-type mismatch.
    - name: Zeek must be PROCESSING the mirror, not just receiving it
      ansible.builtin.shell: |
        set -o pipefail
        f=/nsm/zeek/logs/current/conn.log
        before=$(grep -vc '^#' "$f" 2>/dev/null || echo 0)
        sleep 45
        after=$(grep -vc '^#' "$f" 2>/dev/null || echo 0)
        if [ "$after" -gt "$before" ]; then
          echo "GROWING before=$before after=$after"
        else
          echo "STALLED before=$before after=$after"
        fi
      args:
        executable: /bin/bash
      register: zeek_conn
      changed_when: false
      failed_when: false
      # The comparison happens IN BASH and Ansible only looks for a word.
      # The first version compared two regex_search captures in a `until:`
      # conditional, which failed on the controller with "Unknown argument"
      # -- backslash handling differs between a YAML folded scalar and the
      # double-quoted scalar it was tested in. Numbers extracted by Jinja
      # across two escaping layers is a fragile way to ask "is it bigger".
      until: "'GROWING' in zeek_conn.stdout"
      retries: 4
      delay: 20

    - name: Fail if Zeek is receiving packets but logging no connections
      ansible.builtin.fail:
        msg: |
          {{ inventory_hostname }}: conn.log is not growing
          ({{ zeek_conn.stdout | default('no reading') | trim }}).

          Packets ARE arriving -- the tcpdump above proved it. Zeek is
          receiving them and producing nothing, which is a capture or
          link-type mismatch, not a mirroring fault:

            sudo tail -3 /nsm/zeek/spool/worker-1-1/stdout.log
              -> "N packets received, M (100.00%) not processed" is the
                 fingerprint. Near 100% means the capture method cannot read
                 this interface's frames.

            ip -d link show {{ so_monitor_interface }}
              -> must report `gretap`. A plain `gre` device carries no
                 Ethernet header, and SO runs Zeek as
                 `-i af_packet::{{ so_monitor_interface }}`, which requires
                 one. That combination discards 100% of frames silently.

          Suricata is NOT evidence here -- it reads cooked capture natively
          and keeps alerting while Zeek sees nothing.
      when: "'GROWING' not in (zeek_conn.stdout | default(''))"
