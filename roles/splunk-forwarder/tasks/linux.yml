---
- name: Create splunk group
  ansible.builtin.group:
    name: "splunk"
    state: present

- name: Create splunk user
  ansible.builtin.user:
    name: "{{ splunk_user }}"
    group: "splunk"
    create_home: yes
    shell: /bin/bash
    state: present

- name: Create SPLUNK_HOME directory
  ansible.builtin.file:
    path: "/opt/splunkforwarder"
    state: directory
    owner: "{{ splunk_user }}"
    group: "splunk"
    mode: '0755'

- name: Download Splunk Forwarder for Debian/Ubuntu
  ansible.builtin.get_url:
    url: "{{ splunk_forwarder_installer_deb }}"
    dest: /tmp/splunkfwd.deb
    mode: '0644'
    use_proxy: yes
    timeout: 300
    validate_certs: no
  environment:
    http_proxy: "http://{{ inet_proxy_addr }}:{{ inet_proxy_port }}"
    https_proxy: "http://{{ inet_proxy_addr }}:{{ inet_proxy_port }}"
  when:
    - ansible_os_family == "Debian"

- name: Install Splunk Forwarder package
  ansible.builtin.apt:
    deb: /tmp/splunkfwd.deb
    state: present
  when:
    - ansible_os_family == "Debian"

- name: Set ownership of splunk directory
  ansible.builtin.file:
    path: "/opt/splunkforwarder"
    owner: "{{ splunk_user }}"
    group: "splunk"
    recurse: yes
    state: directory

- name: Add splunk user to adm group
  ansible.builtin.user:
    name: "{{ splunk_user }}"
    groups: adm
    append: yes
  become: yes

- name: Add splunkfwd user to adm group
  ansible.builtin.user:
    name: splunkfwd
    groups: adm
    append: yes
  become: yes

- name: Add splunk user to docker group
  ansible.builtin.user:
    name: "{{ splunk_user }}"
    groups: docker
    append: yes
  become: yes
  when: "'wordpress-pv' in group_names"

- name: Add splunkfwd user to docker group
  ansible.builtin.user:
    name: splunkfwd
    groups: docker
    append: yes
  become: yes
  when: "'wordpress-pv' in group_names"

- name: Add splunk user to proxy group
  ansible.builtin.user:
    name: "{{ splunk_user }}"
    groups: proxy
    append: yes
  become: yes
  when: "'proxy' in group_names"

- name: Add splunkfwd user to proxy group
  ansible.builtin.user:
    name: splunkfwd
    groups: proxy
    append: yes
  become: yes
  when: "'proxy' in group_names"

- name: Copy templated inputs
  ansible.builtin.template:
    src: /etc/ansible/roles/splunk-forwarder/templates/lin_inputs.conf.j2
    dest: "/opt/splunkforwarder/etc/system/local/inputs.conf"
  register: inputs_conf_stat

- name: Copy templated outputs
  ansible.builtin.template:
    src: /etc/ansible/roles/splunk-forwarder/templates/outputs.conf.j2
    dest: "/opt/splunkforwarder/etc/system/local/outputs.conf"
  register: outputs_conf_stat

- name: Copy templated limits
  ansible.builtin.template:
    src: /etc/ansible/roles/splunk-forwarder/templates/limits.conf.j2
    dest: "/opt/splunkforwarder/etc/system/local/limits.conf"
  register: limits_conf_stat

- name: Copy admin seed file
  ansible.builtin.template:
    src: /etc/ansible/roles/splunk-forwarder/templates/user-seed.conf.j2
    dest: "/opt/splunkforwarder/etc/system/local/user-seed.conf"
  register: user_seed_conf_stat

- name: Configure rsyslog to use correct hostname
  ansible.builtin.template:
    src: templates/rsyslog-hostname.conf.j2
    dest: /etc/rsyslog.d/00-hostname.conf
    owner: root
    group: root
    mode: '0644'
  become: yes
  register: rsyslog_config_deployed

- name: Restart rsyslog if configuration changed
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  become: yes
  when: rsyslog_config_deployed.changed

- name: Check if Splunk has been started before
  ansible.builtin.stat:
    path: "/opt/splunkforwarder/etc/splunk-launch.conf"
  register: splunk_launch_conf

- name: Start Splunk forwarder for first time and accept license
  ansible.builtin.command:
    cmd: "/opt/splunkforwarder/bin/splunk start --accept-license --answer-yes --no-prompt"
    creates: "/opt/splunkforwarder/var/run/splunk/splunkd.pid"
  become_user: "{{ splunk_user }}"
  when: not splunk_launch_conf.stat.exists

- name: Check if SplunkForwarder service file exists
  ansible.builtin.stat:
    path: /etc/systemd/system/SplunkForwarder.service
  register: splunk_service_file

- name: Enable Splunk forwarder to start at boot
  ansible.builtin.command:
    cmd: "/opt/splunkforwarder/bin/splunk enable boot-start -user {{ splunk_user }} --accept-license --answer-yes --no-prompt"
  when: not splunk_service_file.stat.exists
  register: boot_start_result

- name: Reload systemd daemon if service was created
  ansible.builtin.systemd:
    daemon_reload: yes
  when: boot_start_result is changed

- name: Ensure Splunk forwarder service is enabled and running
  ansible.builtin.systemd:
    name: SplunkForwarder
    state: started
    enabled: yes

# --- forwarder must actually be delivering, not merely installed -----------
# POSITION IS LOAD-BEARING. This block previously sat BEFORE "Start Splunk
# forwarder for first time and accept license", so on a fresh host it ran
# `splunk restart` against an installation whose licence had never been
# accepted. That prints:
#
#     Do you agree with this license? [y/n]:
#
# and blocks on stdin. In an unattended deploy nothing answers, and the play
# hangs indefinitely -- observed twice on clean runs, once overnight. It has to
# come after the first-start/boot-start sequence below.
#
# --accept-license --answer-yes --no-prompt on top, so the command can never
# ask a question even if it is somehow reached early again. And `timeout` on
# top of THAT, because "cannot hang" should not depend on my having predicted
# every prompt. A task in an unattended deploy that can block forever is a
# defect regardless of how unlikely the block is.
- name: Is the forwarder actually connected to an indexer?
  ansible.builtin.shell: |
    ss -ant state established 2>/dev/null \
      | grep -cE '({{ splunk_indexers | map('regex_escape') | join('|') }}):{{ splunk_forwarder_port }}' || true
  become: true
  register: lin_uf_conn
  changed_when: false

# Restart on OUTCOME, not on change. Restart-when-a-template-changed cannot
# recover from its own failure: the template lands, the restart fails, and the
# next run sees no change and skips -- reporting a clean sweep across an estate
# that cannot deliver a byte.
- name: Restart the forwarder
  ansible.builtin.command: >-
    timeout 300 /opt/splunkforwarder/bin/splunk restart
    --accept-license --answer-yes --no-prompt
  become: true
  register: lin_uf_restart
  changed_when: true
  failed_when: lin_uf_restart.rc not in [0, 124]
  when: >-
    (lin_uf_conn.stdout | trim | int) == 0
    or inputs_conf_stat.changed or outputs_conf_stat.changed
    or limits_conf_stat.changed

- name: Fail clearly if the restart timed out rather than errored
  ansible.builtin.fail:
    msg: >-
      splunk restart on {{ inventory_hostname }} hit the 300s timeout (rc=124).
      It did not error -- it stopped responding, which historically means it is
      waiting on a prompt. Check /opt/splunkforwarder/var/log/splunk/splunkd.log
      and run the command by hand to see what it is asking.
  when:
    - lin_uf_restart is not skipped
    - lin_uf_restart.rc | default(0) == 124

- name: The forwarder must end up connected to an indexer
  ansible.builtin.shell: |
    ss -ant state established 2>/dev/null \
      | grep -cE '({{ splunk_indexers | map('regex_escape') | join('|') }}):{{ splunk_forwarder_port }}' || true
  become: true
  register: lin_uf_conn_after
  changed_when: false
  until: (lin_uf_conn_after.stdout | trim | int) > 0
  retries: 12
  delay: 10
