---
# =========================================================================
# splunk_indexer — cluster peer
# =========================================================================
# Same reasoning as splunk_cluster_manager: cluster configuration is
# server.conf state and is written as state. `splunk edit cluster-config`
# returned success while leaving [clustering] empty, and `show cluster-config`
# is not a valid subcommand on this build, so the gate that depended on it
# never gated anything.
#
# Runs AFTER the base `splunk` role in the same play. The base role rewrites
# server.conf in full; these tasks run behind it and re-assert every run, which
# is what makes the ordering safe rather than merely conventional.
# =========================================================================

# An earlier deploy ran the base role with a populated `indices`, which wrote
# system/local/indexes.conf on the peers. That file OVERRIDES the cluster
# bundle for the same stanza, including repFactor -- the index then works and
# is silently unreplicated, while cluster-status still reports both factors met
# because there are no replicated buckets to be short on.
# group_vars/splunk_indexer.yml stops it being created; this removes what an
# earlier run already left behind.
- name: Remove locally-defined indexes so the cluster bundle is authoritative
  ansible.builtin.file:
    path: /opt/splunk/etc/system/local/indexes.conf
    state: absent
  register: idx_local_indexes

- name: Wait for the Splunk REST API
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ splunk_mgmt_port }}/services/server/info"
    method: GET
    user: "{{ splunk_admin }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: idx_api
  retries: 30
  delay: 10
  until: idx_api.status == 200

# The manager must be IN MANAGER MODE before a peer joins, not merely
# answering. An earlier version checked /services/server/info, which any Splunk
# answers regardless of cluster role -- so the check passed while the manager
# had an empty [clustering] stanza, and the peers failed with "Could not
# contact manager" one task later.
- name: Wait for the cluster manager to be in manager mode
  ansible.builtin.uri:
    url: "https://{{ splunk_cluster_manager_ip }}:{{ splunk_mgmt_port }}/services/cluster/config?output_mode=json"
    method: GET
    user: "{{ splunk_admin }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
    return_content: true
  register: idx_cm_mode
  retries: 30
  delay: 10
  until: >-
    '"mode":"manager"' in (idx_cm_mode.content | default('') | regex_replace('\s+', ''))

- name: Configure the [clustering] stanza for peer mode
  community.general.ini_file:
    path: /opt/splunk/etc/system/local/server.conf
    section: clustering
    option: "{{ item.k }}"
    value: "{{ item.v }}"
    mode: '0600'
    no_extra_spaces: true
  loop:
    - { k: 'mode',         v: 'peer' }
    - { k: 'manager_uri',  v: 'https://{{ splunk_cluster_manager_ip }}:{{ splunk_mgmt_port }}' }
    - { k: 'pass4SymmKey', v: '{{ splunk_cluster_secret }}' }
  loop_control:
    label: "{{ item.k }}"
  register: idx_clustering

# The replication listener is a bare stanza with no keys — how peers stream
# buckets to each other. Without it a peer joins and then cannot replicate,
# which shows up as the replication factor never being met.
- name: Open the replication port
  community.general.ini_file:
    path: /opt/splunk/etc/system/local/server.conf
    section: "replication_port://{{ splunk_replication_port }}"
    mode: '0600'
  register: idx_replport

- name: Restart Splunk to apply peer mode
  ansible.builtin.command: /opt/splunk/bin/splunk restart
  when: (idx_clustering is changed) or (idx_replport is changed) or (idx_local_indexes is changed)
  changed_when: true

- name: Wait for the REST API after the restart
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ splunk_mgmt_port }}/services/server/info"
    method: GET
    user: "{{ splunk_admin }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: idx_api2
  retries: 30
  delay: 10
  until: idx_api2.status == 200

# The base role's inputs.conf declares [splunktcp://9997]. An earlier version
# also ran `splunk enable listen 9997`, which was redundant and failed on the
# second run because the listener already existed -- with the message on
# stderr, which the failed_when never checked. Assert the port is open instead
# of re-issuing a command whose success says nothing.
- name: The receiving port must actually be listening
  ansible.builtin.shell: |
    ss -lnt | grep -c ':{{ splunk_indexer_receiving_port }} ' || true
  register: idx_listening
  changed_when: false
  until: (idx_listening.stdout | trim | int) > 0
  retries: 12
  delay: 10

# Assert from the MANAGER's view, not this peer's. A peer holding the config is
# transport; the manager listing it Up is the outcome.
- name: The cluster manager must list this peer as Up
  ansible.builtin.shell: |
    set -o pipefail
    /opt/splunk/bin/splunk show cluster-status \
      -auth '{{ splunk_admin }}:{{ splunk_admin_password }}' 2>/dev/null \
      | grep -A3 '{{ hostvars[inventory_hostname].network_interfaces[1].ipv4.address }}' \
      | grep -c 'Up' || true
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['splunk_cluster_manager'][0] }}"
  register: idx_peer_up
  changed_when: false
  until: (idx_peer_up.stdout | trim | int) > 0
  retries: 12
  delay: 15

- name: Report peer state
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}
      ({{ hostvars[inventory_hostname].network_interfaces[1].ipv4.address }}):
      peer of {{ splunk_cluster_manager_ip }}, receiving on
      {{ splunk_indexer_receiving_port }}, replicating on
      {{ splunk_replication_port }} — manager reports Up.
