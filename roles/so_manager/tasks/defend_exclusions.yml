---
# =========================================================================
# defend_exclusions.yml — Elastic Defend event filters, salt-native
# =========================================================================
# LIFETIME INVARIANT. Included above the end_host probe as well as below it,
# like airgap_mode.yml: an installed manager must still receive corrections.
# The filters live in Fleet's database, so a rebuilt manager or a reset Fleet
# loses them and only a re-run puts them back (PORTING_GUIDE 9.4b).
# =========================================================================

- name: Defend filters — directory for the local/salt override
  ansible.builtin.file:
    path: "{{ so_defend_filters_src | dirname }}"
    state: directory
    owner: socore
    group: socore
    mode: '0755'

# local/salt precedes default/salt in file_roots, so this becomes the source
# the highstate uses for custom-filters-raw. Writing custom-filters-raw itself
# would be reverted -- it is `file.managed` from this very path.
- name: Defend filters — render the override of SO's custom-filters source
  ansible.builtin.template:
    src: elastic-defend-custom-filters.yaml.j2
    dest: "{{ so_defend_filters_src }}"
    owner: socore
    group: socore
    mode: '0644'
  register: defend_src

# Apply now rather than waiting for the 03:00 cron. The helper reads the raw
# file, converts it into the custom-filters/ directory and uploads each rule
# to Fleet.
- name: Defend filters — push the salt-managed copy of the raw file
  ansible.builtin.command: salt-call state.apply elasticfleet.config queue=True
  register: defend_state
  changed_when: defend_state.rc == 0
  until: defend_state.rc == 0
  retries: 40
  delay: 30

# The helper POSTs to /api/exception_lists/items but NEVER creates the list
# itself -- confirmed by reading so_elastic_defend_filters_helper.py, which
# only ever builds that one URL. Elastic Security normally creates
# `endpoint_event_filters` lazily on first use of the Event Filters UI, so on
# a grid nobody has clicked through it does not exist, and every POST returns:
#
#   404 - {"message":"exception list id: \"endpoint_event_filters\" does not exist"}
#
# That is what happened on 2026-08-07: our two filters converted correctly on
# disk and uploaded nothing. Create the list first; 409 means it already
# exists, which is success.
#
# Plain HTTP on 5601 with basic auth from curl.config -- the same URL and
# credentials the helper uses, not a guess at Elastic's API surface.
- name: Defend filters — ensure the endpoint_event_filters list exists
  ansible.builtin.shell: |
    set -o pipefail
    curl -s -o /tmp/.defend_list_create -w '%{http_code}' \
      --config /opt/so/conf/elasticsearch/curl.config \
      -X POST 'http://localhost:5601/api/exception_lists' \
      -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
      -d '{"list_id":"endpoint_event_filters","name":"Endpoint Event Filters List","description":"Endpoint Event Filters List","type":"endpoint_events","namespace_type":"agnostic"}'
  args:
    executable: /bin/bash
  register: defend_list
  changed_when: defend_list.stdout | trim == '200'
  failed_when: defend_list.stdout | trim not in ['200', '409']

- name: Defend filters — report list state
  ansible.builtin.debug:
    msg: >-
      endpoint_event_filters list
      {{ 'created' if defend_list.stdout | trim == '200' else 'already existed' }}

- name: Defend filters — run the helper to upload them to Fleet
  ansible.builtin.command: >-
    python3 /sbin/so-elastic-defend-manage-filters.py
    -c /opt/so/conf/elasticsearch/curl.config
    -d /opt/so/conf/elastic-fleet/defend-exclusions/disabled-filters.yaml
    -i /nsm/securityonion-resources/event_filters/
    -i {{ so_defend_filters_out }}/
  register: defend_apply
  changed_when: false
  failed_when: false

# AUTHORITATIVE CHECK — ask Kibana, not the filesystem.
#
# The previous version verified our rule IDs were in the GENERATED DIRECTORY
# and the report then declared them "active". Directory presence proves the
# local/salt override and the raw->directory conversion worked; it says
# NOTHING about whether Fleet accepted them. On 2026-08-07 that check passed
# while every upload 404'd, and the play reported success. Same proxy-for-claim
# mistake this log catalogues -- committed in the very change that claimed to
# avoid it.
#
# The helper keys items by our UUID (api_request builds ?item_id={guid}), so
# a 200 here means that exact filter exists in the list.
- name: Defend filters — verify each filter exists in Kibana
  ansible.builtin.shell: |
    set -o pipefail
    curl -s -o /dev/null -w '%{http_code}' \
      --config /opt/so/conf/elasticsearch/curl.config \
      -H 'kbn-xsrf: true' \
      'http://localhost:5601/api/exception_lists/items?item_id={{ item.id }}&namespace_type=agnostic'
  args:
    executable: /bin/bash
  loop: "{{ so_defend_exclusions }}"
  loop_control:
    label: "{{ item.event_type }} {{ item.id }}"
  register: defend_verify
  changed_when: false
  failed_when: defend_verify.stdout | trim != '200'

- name: Defend filters — report
  ansible.builtin.debug:
    msg: >-
      {{ so_defend_exclusions | length }} Defend exclusion(s) CONFIRMED present
      in Kibana's endpoint_event_filters list.
      {{ 'Helper reported errors on other rules: ' ~ (defend_apply.stdout_lines | select('search', 'Error') | list | length) ~ ' (SO ships ~250 Windows filters through the same helper)'
         if defend_apply.stdout_lines | default([]) | select('search', 'Error') | list | length > 0
         else 'Helper reported no errors.' }}
