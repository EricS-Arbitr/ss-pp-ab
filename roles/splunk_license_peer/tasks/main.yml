---
# =========================================================================
# splunk_license_peer — central licensing
# =========================================================================
# THE PROBLEM THIS FIXES, observed in Splunk Web 2026-08-25:
#
#   "Peer pp-splunk-idx02 has the same license installed as peer
#    pp-splunk-idx01. Peer pp-splunk-idx02 is using license master self, and
#    peer pp-splunk-idx01 is using license master self. Please fix this issue
#    in 72 hours, otherwise peer will be disabled."
#
# The cause is not the indexers. The base `splunk` role downloads
# {{ splunk_license }} from Nexus and runs `splunk add license` with no
# condition on the host's tier, and that role runs in ALL FOUR distributed
# Splunk plays -- cluster manager, both peers, and the search head. So four
# nodes each installed the SAME license file and each became its own
# independent license manager ("license master self"). Splunk counts that as
# one licensed volume claimed four times over, which is why it threatens to
# disable a peer rather than merely warning.
#
# The warning names only the two indexers because the cluster manager compares
# licenses across its PEERS. pp-splunk holds the same duplicate and is simply
# not in the set being compared -- so fixing only the two hosts named in the
# message would leave a third duplicate in place.
#
# THE FIX is the standard Splunk topology and matches what host_vars/
# pp-splunk-cm.yml already declared this host to be: one license manager, every
# other node a license peer pointed at it. Splunk's own guidance for a
# deployment this size co-locates the license manager on the management node
# alongside the cluster manager, deployer and monitoring console, which is
# exactly what pp-splunk-cm is.
#
# WHY THIS IS A ROLE AND NOT TASKS IN THE TIER ROLES: three hosts across two
# plays (splunk_indexer and splunk_search_head) need byte-identical treatment.
# Duplicating it into both tier roles means two places to keep in step, and the
# indexer copy would drift from the search head copy the first time only one
# was edited.
#
# ORDERING: this runs AFTER the base `splunk` role in the same play, which is
# what makes it safe. The base role rewrites server.conf in full and re-adds
# the license; these tasks run behind it and re-assert every run. Never give
# this role a tag the base role does not share -- running it alone would
# configure a peer whose server.conf the next base-role run silently reverts.
# =========================================================================

- name: Find locally installed licenses that make this node its own manager
  ansible.builtin.find:
    paths: "{{ splunk_license_stack_dir }}"
    patterns: '*.lic,*.license,*.xml'
    file_type: file
  register: lic_local

# A license peer ignores locally installed licenses, so leaving them would
# probably be harmless -- but "probably harmless" is what produced the
# duplicate in the first place. Removing them makes the node's state
# unambiguous: exactly one node in this deployment holds a license file, and
# `find` on any other node returns nothing.
- name: Remove locally installed licenses (pp-splunk-cm is the only holder)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ lic_local.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: lic_removed

# The base role stages a copy at etc/licenses/splunk.license, outside any stack
# subdirectory. Splunk only reads licenses from the stack subdirectories, so
# that copy is inert -- it is deliberately LEFT in place. Deleting it would
# make the base role re-download it from Nexus on every run and this role
# delete it again, reporting `changed` forever on a deployment that never
# actually changed. An idempotent play that reports churn trains you to ignore
# its output.

# WHICH KEY NAME? ASK THE HOST, DO NOT RECALL IT.
#
# Splunk 9.x renamed "master" to "manager" across the product, but it did not
# land in every stanza at the same release. [clustering] on this build takes
# manager_uri (confirmed when the cluster roles were written). Whether
# [license] on 9.4.0 takes manager_uri, master_uri, or accepts both as
# deprecated aliases is NOT something to assume from the stanza next door: the
# wrong key is not an error, it is silently ignored, and the node stays a
# self-manager behind a config file that reads as though it were fixed. That is
# the worst possible failure mode -- the 72-hour clock keeps running while the
# fix appears to be in place.
#
# So the spec file on the host decides. It is the authority, it is already
# present, and it costs one task.
#
# MEASURED ON pp-splunk-cm 2026-08-25: the [license] stanza documents BOTH
# spellings. So "which key exists" is the wrong question -- the first version
# of this task asked exactly that and took `head -1`, which selects by the
# order Splunk happens to list them in the spec file. That returned master_uri,
# which worked (the peers registered and the warning cleared), but it was
# arbitrary: nothing about file order says which key is current, and the same
# logic would pick the deprecated alias on any build that lists it first.
#
# The spec marks the superseded key DEPRECATED in its own description block, so
# that is what gets read. Preference is manager_uri, then master_uri, then
# whatever is listed first -- and each candidate is skipped if its OWN block
# says deprecated. Note this is correct WITHOUT knowing which of the two Splunk
# deprecated: if it ever turns out to be manager_uri, the same logic picks
# master_uri and nothing changes. That property is the point. A rule that
# depends on my recollection of a vendor rename is the thing being removed.
- name: Ask server.conf.spec which key the [license] stanza takes
  ansible.builtin.shell: |
    awk '
      /^\[license\]/ { inlic=1; next }
      /^\[/           { inlic=0 }
      !inlic          { next }
      /^[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=/ {
          key = $1
          if (key == "manager_uri" || key == "master_uri") { cand[key]=1; order[++n]=key }
          else key = ""
          next
      }
      key != "" && tolower($0) ~ /deprecat/ { dep[key]=1 }
      END {
          if (cand["manager_uri"] && !dep["manager_uri"]) { print "manager_uri"; exit }
          if (cand["master_uri"]  && !dep["master_uri"])  { print "master_uri";  exit }
          if (n > 0) print order[1]
      }
    ' /opt/splunk/etc/system/README/server.conf.spec
  args:
    executable: /bin/bash
  register: lic_keyname
  changed_when: false
  failed_when: lic_keyname.stdout | trim == ''

- name: Point this node at the central license manager
  community.general.ini_file:
    path: /opt/splunk/etc/system/local/server.conf
    section: license
    option: "{{ lic_keyname.stdout | trim }}"
    value: "https://{{ splunk_cluster_manager_ip }}:{{ splunk_mgmt_port }}"
    mode: '0600'
    no_extra_spaces: true
  register: lic_cfg

# If the spec named manager_uri, a master_uri left behind by an earlier attempt
# would still be sitting in the same stanza. Splunk's precedence between a key
# and its deprecated alias is not worth researching when removing the stale one
# costs a task and leaves exactly one setting in the file.
- name: Remove the other spelling so only one key governs
  community.general.ini_file:
    path: /opt/splunk/etc/system/local/server.conf
    section: license
    option: "{{ 'master_uri' if (lic_keyname.stdout | trim) == 'manager_uri' else 'manager_uri' }}"
    state: absent
    mode: '0600'
  register: lic_cfg_stale

- name: Restart Splunk to apply license peer mode
  ansible.builtin.command: /opt/splunk/bin/splunk restart
  when: (lic_cfg is changed) or (lic_cfg_stale is changed) or (lic_removed is changed)
  changed_when: true
  # Same reasoning as the cluster roles: `splunk restart` returns 1 when Splunk
  # Web is not up within its own wait even though splunkd started cleanly. The
  # REST wait below is the real assertion.
  failed_when: false

- name: Wait for the REST API after the restart
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ splunk_mgmt_port }}/services/server/info"
    method: GET
    user: "{{ splunk_admin }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: lic_api
  retries: 30
  delay: 10
  until: lic_api.status == 200

# ASSERT FROM THE MANAGER'S VIEW, not this node's.
#
# This node holding `master_uri` in a file is transport. The manager listing it
# as a registered license peer is the outcome, and only the second one proves
# the two actually reached each other -- a wrong URI, an unreachable 8089 or a
# pass4SymmKey mismatch all leave the config file looking perfect.
#
# Greps the hostname because /services/licenser/slaves labels each entry with
# it. Fails CLOSED: if the endpoint shape is not what is expected here, the
# count is 0 and this fails loudly, rather than passing on a predicate that
# cannot return true. That direction is deliberate -- this repo has already
# shipped five checks that could only ever return false and were read as
# healthy for days.
- name: The license manager must list this node as a registered peer
  ansible.builtin.shell: |
    set -o pipefail
    curl -sS -k -u '{{ splunk_admin }}:{{ splunk_admin_password }}' \
      'https://127.0.0.1:{{ splunk_mgmt_port }}/services/licenser/slaves?output_mode=json&count=0' \
      | grep -c '"label"[[:space:]]*:[[:space:]]*"{{ inventory_hostname }}"' || true
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['splunk_cluster_manager'][0] }}"
  register: lic_registered
  changed_when: false
  until: (lic_registered.stdout | trim | int) > 0
  retries: 12
  delay: 10
  failed_when: (lic_registered.stdout | trim | int) < 1
