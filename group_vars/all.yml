# --- Windows DNS Server query logging (pp-dc01/02/03) ---------------------
# Splunk_TA_windows ships NO input for the modern
# Microsoft-Windows-DNS-Server/Analytical ETW channel. Its only per-query
# mechanism is the legacy file-based debug log, read with MonitorNoHandle
# (the input type for files a service holds open exclusively):
#
#   [MonitorNoHandle://$WINDIR\System32\Dns\dns.log]
#   sourcetype = MSAD:NT6:DNS
#
# WHY BOTHER, given Sysmon already logs DNS: Sysmon's EventCode 22 records the
# querying process but NOT which server answered, and carries no message_type
# or record_type. Those are properties of the transaction the server sees and
# the client cannot. Measured 2026-08-18: DNS.message_type was "unknown" for
# 100% of 4,461 events, which blanks every ES DNS panel that filters on it.
# The two sources are complementary -- Sysmon says which process asked, the DC
# says what was asked and answered.
#
# COST: DNS debug logging is not free. It writes every query to disk on a
# domain controller. Bounded below by size cap + rollover; check the file size
# after a day of real traffic before enabling emulated users.
dns_debug_logging: true

# UNIT RESOLVED 2026-08-18, the hard way. -MaxMBFileSize is MEGABYTES, as its
# name says. Setting it to 500000000 (on the assumption it took bytes) made DNS
# truncate dns.log on every write: file present, lastwritetime advancing, size
# permanently 0, on all three DCs, through three enable attempts and a service
# restart. Disabling rollover proved it -- the log filled to 646 KB in twenty
# seconds. The arithmetic confirms the unit: if the field were bytes, 500000000
# is ~477 MB and a 646 KB file could never trip the threshold.
dns_debug_log_max_mb: 500

# Minimum bytes the log must reach after generated traffic. Deliberately well
# above any plausible byte-interpretation of the cap above: if a future edit
# reintroduces the unit confusion, the file cannot exceed the cap and this
# assertion fails instead of silently logging nothing.
dns_debug_log_min_bytes: 50000

# Central syslog collector. All Linux/VyOS/pfSense hosts forward to this IP.
# pp-syslog runs rsyslog listening on UDP+TCP 514, writes per-host files at
# /var/log/remote/<hostname>/syslog.log, and the Splunk UF on pp-syslog
# tails them into Splunk (netfw index for vyos/pfsense, linux for Linux).
syslog_server_ip: "172.16.2.9"           # pp-syslog's PP-Services IP

# Splunk indices created by the splunk role on pp-splunk.
# Grouped by CIM data model / log volume: Sysmon is split out from
# the rest of the Windows event logs because of volume + security value.
# Volumes MEASURED on pp-splunk 2026-08-18 over 7 days. Three of these were
# annotated "Currently unused" and are not -- the comments predated the syslog
# and Squid wiring. Corrected here because roles/splunk-verify-user's visibility
# gate needs to know which indexes genuinely carry data.
indices:
  - name: "windows"       # 482,345 / 7d — Win event logs (System/Security/Application/Firewall/PowerShell)
  - name: "sysmon"        # 406,052 / 7d — Sysmon; ACTIVE, not unused
  - name: "linux"         # 330,082 / 7d — Linux syslog
  - name: "netfw"         # 432,247 / 7d — pfSense/VyOS syslog via pp-syslog; ACTIVE, not unused
  - name: "proxy"         # 151,403 / 7d — Squid access logs; ACTIVE, not unused
  - name: "mail"          #       0 / 7d — still reserved for Exchange when wired up



# --- Email service (is-inet Postfix/Dovecot/webmail via `email` role) ------
# Multi-domain mail stack on is-inet. Each entry drives cert generation,
# Postfix config, Dovecot SSL blocks, and a webmail config. Mailboxes are
# provisioned from each domain's `DomainUsers` list (group_vars/voltgrid.yml).
#
# Bare-domain naming (voltgrid.com, outlook.com) — NOT mail.<domain> — so
# webmail login accepts `bob.burke@voltgrid.com` (which is what users
# expect). The email role uses this same string as (a) the CN/SAN on the
# generated TLS cert Dovecot presents, (b) the imap_host/smtp_host in the
# webmail's domain ini file, and (c) the login domain the webmail form
# matches against. Requires bare-domain A records under `global_dns_records`
# below so the container's IMAP client can resolve `voltgrid.com` and
# `outlook.com` to is-inet.
#
# Webmail UI is still accessed via the browser URL http://mail.outlook.com/
# — the prebuilt email container image only has an httpd vhost for that
# name. Login form accepts any configured email_domain regardless of which
# URL you reached it on.
email_domains:
  - name: "voltgrid.com"
  - name: "outlook.com"

# --- Simulated public DNS on is-inet (populated by `global_dns` role) -----
# Every record's `value` must be an IP that traffic can actually reach:
#   - www / billing.voltgrid.com  → pp-external-firewall WAN (75.21.1.1)
#     NAT'd inbound to pp-www (172.16.8.5) — see pp-external-firewall
#     host_vars pfsense_nat_rules
#   - mail.voltgrid.com           → is-inet's primary interface (200.200.200.2)
#     where Postfix/Dovecot listens
#   - mail.outlook.com            → 52.96.223.2, a lo alias is-inet claims
#     for the Microsoft-owned range (per range-dev convention)
#
# Anything pointing at 200.200.200.1 would land on pp-isp-router (a VyOS
# BGP router with no web/mail services) and time out — that value used to
# be here and is intentionally corrected.
global_dns_records:
  # --- voltgrid.com public web (NAT-reflected through pp-external-firewall) ---
  - name: "www"
    type: "A"
    value: "75.21.1.1"
    zone: "voltgrid.com"
  - name: "billing"
    type: "A"
    value: "75.21.1.1"
    zone: "voltgrid.com"

  # --- voltgrid.com mail (bare-domain apex + traditional mail.* + MX) ---
  # Point both the apex and mail.voltgrid.com at 52.96.223.2 -- that's the
  # ONLY IP the prebuilt email container image binds Dovecot / Postfix to
  # (verified via `ss -lntp` inside the container 2026-07-02). Dovecot uses
  # SNI + Ansible-managed `local_name voltgrid.com {...}` blocks in 10-ssl.conf
  # to present the voltgrid.com cert when clients connect with SNI voltgrid.com.
  # Same IP handles both mail domains cleanly -- standard multi-domain server
  # pattern. 200.200.200.2 (is-inet primary) is kept out of the mail path
  # because nothing there is bound to :143/:993/:25/:465.
  - name: ""                              # zone apex A record (bare-domain)
    type: "A"
    value: "52.96.223.2"
    zone: "voltgrid.com"
  - name: "mail"
    type: "A"
    value: "52.96.223.2"
    zone: "voltgrid.com"
  - type: "MX"
    priority: 10
    value: "mail.voltgrid.com"
    zone: "voltgrid.com"

  # --- Outlook.com (real MSFT IP that is-inet claims as a lo alias) ---
  - name: ""                              # zone apex A record (bare-domain)
    type: "A"
    value: "52.96.223.2"
    zone: "outlook.com"
  - name: "mail"
    type: "A"
    value: "52.96.223.2"
    zone: "outlook.com"
  - type: "MX"
    priority: 10
    value: "mail.outlook.com"
    zone: "outlook.com"