# =========================================================================
# group_vars/all/security_onion.yml — Security Onion 2.4.x (PowerPlant)
# =========================================================================
# MUST live under group_vars/all/, not group_vars/so_all.yml.
#
# It was in so_all.yml first, which scopes every variable to the [so_all]
# group — so `so_apt_mirror`, which runs on the ANSIBLE CONTROLLER, could
# not see so_git_ref and the phase-10 play died with "'so_git_ref' is
# undefined" (2026-08-03). The controller, the mirror routers and the SO
# nodes all consume these, and they are all in different groups.
#
# Same shape as so-ansible's so_bundled_rules_filename bug (UPSTREAM_FIXES
# 2026-07-29 fresh-range 3): a variable placed in a scope narrower than its
# consumers. Everything here is so_*-prefixed, so a global scope collides
# with nothing.
# =========================================================================
# Ported from so-ansible's group_vars (all/main.yml + so_all.yml), which was
# validated end-to-end on a fresh range 2026-07-29/30. Values here are the
# PowerPlant-specific ones; anything not listed keeps the role defaults.
#
# See so-ansible/docs/PORTING_GUIDE.md — especially §9, the failure modes
# that silently break a new range. Read it before debugging this stack.
# =========================================================================

# --- Pinned SO source ----------------------------------------------------
# The `automation/` answer-file mechanism exists only at this pin; SO's
# tagged releases do not carry it. so_base snapshots so-setup and friends
# from here. Do NOT bump casually — see PORTING_GUIDE §10 for the functions
# that must be re-diffed on upgrade.
so_git_ref: "55af7eb541f086c4e7d6d3182fb2bc4fbc2b9e21"   # 2.4/main HEAD @ 2026-07-22
so_git_branch: "2.4/main"
so_git_repo: "https://github.com/Security-Onion-Solutions/securityonion.git"

# Only working install mode on Ubuntu — `so-setup iso` is CentOS/Rocky only.
so_setup_type: "network"

# --- Install-time egress -------------------------------------------------
# so-setup pulls from packages.securityonion.net, Docker, Elastic and Ubuntu
# repos. Reuses the range's existing mgmt-plane proxy rather than defining a
# second one; that plane is out-of-band and invisible in-scenario.
so_upstream_proxy: "http://{{ inet_proxy_addr }}:{{ inet_proxy_port }}"

# --- In-range mirror (on the Ansible controller) -------------------------
# Serves the pinned SO source + the ETOPEN tarball + airgap content repos.
# `ansible` is 10.255.240.152 (mgmt) / 10.10.10.10 (control-10). The mgmt IP
# is used because that is the interface the SO nodes can reach it on.
# NOTE: earmarked to move to a platform-hosted Nexus later (Eric, 2026-07-30).
so_mirror_host: "10.255.240.152"
so_mirror_port: 80
so_mirror_url: "http://{{ so_mirror_host }}:{{ so_mirror_port }}"
so_source_tarball_url: "{{ so_mirror_url }}/so-source/securityonion-{{ so_git_ref[:12] }}.tar.gz"
so_bundled_rules_filename: "emerging.rules.tar.gz"

# --- Grid ----------------------------------------------------------------
so_manager_ip: "172.16.9.30"
so_manager_hostname: "so-manager"
so_msrv: "{{ so_manager_hostname }}"
so_msrv_ip: "{{ so_manager_ip }}"

# --- Range subnets -------------------------------------------------------
so_subnet_security: "172.16.9.0/24"          # pp-security — SO lives here
so_subnet_services: "172.16.2.0/24"
so_subnet_business: "172.16.3.0/24"
so_subnet_engineering: "172.16.4.0/24"
so_subnet_legal: "172.16.5.0/24"
so_subnet_infosec: "172.16.6.0/24"
so_subnet_dmz: "172.16.8.0/24"

# In-range subnets that bypass the upstream proxy (so_base/environment.j2).
# PowerPlant has no "operations" subnet, which is what so-ansible's template
# used to hardcode — hence the list form.
so_no_proxy_subnets:
  - "{{ so_subnet_security }}"
  - "{{ so_subnet_services }}"
  - "{{ so_subnet_business }}"
  - "{{ so_subnet_engineering }}"
  - "{{ so_subnet_legal }}"
  - "{{ so_subnet_infosec }}"
  - "{{ so_subnet_dmz }}"

# Who may reach the SOC WebUI. ALLOW_CIDR in the manager answer file must be
# a SINGLE CIDR (so-ansible UPSTREAM_FIXES 2026-07-22) — so_subnet_security
# is what gets rendered there; this list is for so-allow rules.
so_allow_subnets:
  - "{{ so_subnet_security }}"
  - "10.255.240.0/20"

# --- Answer-file values (rendered into the so-setup templates) -----------
so_nids: "Suricata"
so_zeek_version: "ZEEK"
so_rule_set: "ETOPEN"
so_manager_adv: "BASIC"
so_address_type: "STATIC"
so_web_access_type: "IP"

# SOC WebUI admin + the shared secret search/sensor use to join the manager.
# Both live in group_vars/all/vault.yml (ansible-vault, password `simspace1`),
# added 2026-07-30 along with every other credential in this repo.
so_web_user: "admin@voltgrid.com"
so_web_password: "{{ vault_so_web_password }}"
so_remote_password: "{{ vault_so_remote_password }}"

# --- Airgap mode (IS-INET range) -----------------------------------------
# PowerPlant's in-game plane has no real internet — only is-inet's staged
# simulation. SOC's detection engines would otherwise try github and
# rules.emergingthreats.net every 5 minutes and fail forever.
#
# SO has first-class airgap support keyed off ONE pillar boolean
# (`global:airgap`); setting it swaps every remote content source for a local
# path. so_apt_mirror stages the content, so_manager flips the pillar and
# proves it took. See so-ansible roles/so_manager/tasks/airgap_mode.yml.
so_airgap_mode: true
so_airgap_build_dir: "/var/tmp/so-airgap-build"
so_airgap_etopen_dest: "/nsm/rules/suricata/etopen"
so_airgap_pillar_file: "/opt/so/saltstack/local/pillar/global/adv_global.sls"
so_airgap_repos:
  - name: securityonion-resources
    url: "https://github.com/Security-Onion-Solutions/securityonion-resources"
    dest: "/nsm/rules/detect-sigma/repos/securityonion-resources"
  - name: securityonion-yara
    url: "https://github.com/Security-Onion-Solutions/securityonion-yara"
    dest: "/nsm/rules/detect-yara/repos/securityonion-yara"
  - name: securityonion-resources-playbooks
    url: "https://github.com/Security-Onion-Solutions/securityonion-resources-playbooks"
    dest: "/nsm/airgap-resources/playbooks/securityonion-resources-playbooks"

# --- Elastic Agent endpoint telemetry ------------------------------------
# Subnets that must reach the manager's Fleet ports (8220 control, plus data
# and update). Fed to `so-firewall includehost elastic_agent_endpoint` by
# playbooks/75-endpoint.yml.
#
# Derived from the inventory on 2026-08-04 — every host in [windows] + [linux]
# minus [unmanaged] and the SO grid itself, 44 hosts in 8 subnets. Listed
# explicitly rather than computed at runtime so the permitted set is reviewable,
# and 75-endpoint.yml ASSERTS that every agent target's in-scenario address
# falls inside one of these. Add a host on a new subnet and the assert fails
# loudly instead of that host silently failing to enroll.
so_agent_endpoint_subnets:
  - "172.16.2.0/24"       # PP-Services   — pp-dc01/02, pp-file, pp-mail, pp-sql, pp-syslog
  - "172.16.3.0/24"       # BP            — pp-bp-wkstn-1..6, pp-bp-*
  - "172.16.4.0/24"       # Engineering   — pp-eng-wkstn-1..
  - "172.16.5.0/24"       # Legal Staff   — pp-ls-wkstn-1..
  - "172.16.6.0/24"       # InfoSec       — pp-is-wkstn-1..4, pp-proxy
  - "172.16.8.0/24"       # DMZ           — pp-dmz-dns, pp-dmz-smtp, pp-www
  - "172.16.9.0/24"       # pp-security   — pp-splunk, win-hunt-1
  - "192.168.100.0/24"    # PP-OT-Ctrl    — pp-dc03, pp-dcs-ctrl, pp-ctl-wks-01..04
                          #   NOTE: sits behind pp-ot-firewall (default-deny).
                          #   75-endpoint.yml probes reachability before
                          #   installing rather than assuming the path is open.

# The SO hostgroup that opens Fleet's ports. Confirmed present in
# /opt/so/saltstack/default/salt/firewall/defaults.yaml on 2026-08-04, mapping
# to portgroups elastic_agent_control (8220), _data and _update.
so_agent_firewall_hostgroup: "elastic_agent_endpoint"
