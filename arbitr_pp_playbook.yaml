# =============================================================================
# Endpoint telemetry — Sysmon
# =============================================================================
# Sysmon was previously applied only inside the AUE play, which made endpoint
# telemetry a side effect of running emulated users. Measured consequence on
# 2026-08-18: pp-file, pp-sql, pp-mail and win-hunt-1..6 had no Sysmon service
# at all. The file server, the SQL server and the analysts' own workstations
