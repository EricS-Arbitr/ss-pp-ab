# Linux client config: drop a snippet that forwards everything to pp-syslog
# over UDP/514. Local /var/log/syslog still gets the messages too; the
# remote copy is what Splunk UF (on pp-syslog) ships to Splunk.
- name: Syslog client — Linux
  hosts: linux:!syslog
  gather_facts: false
  become: true
  tasks:
    - name: Drop rsyslog forwarder snippet
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/00-forward.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Forward all logs to central syslog collector (pp-syslog).
          # Managed by Ansible (arbitr_pp_playbook.yaml). UDP — accepted on
          # both UDP and TCP by the server; UDP avoids the queue-up failure
          # mode if pp-syslog is briefly unreachable.
          *.* @{{ syslog_server_ip }}:514
      register: rsyslog_forward
    - name: Restart rsyslog if forwarder snippet changed
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
      when: rsyslog_forward.changed
  tags:
    - syslog
    - syslog_client

# VyOS + vyos_routes_only client config: push the syslog remote-host line.
# `set system syslog host` is idempotent under vyos_config; level "info"
# matches what the GUI default sets.
#
# pp-isp-router is excluded: it represents the upstream ISP, not corporate
# gear, and shipping its logs into the internal syslog collector would be
# unrealistic for the cyber-range scenario (defenders see external-network
# events in their internal SIEM).
- name: Syslog client — VyOS
  hosts: vyos:vyos_routes_only:!pp-isp-router
  gather_facts: false
  tasks:
    - name: Configure remote syslog host
      vyos.vyos.vyos_config:
        match: line
        lines:
          - "set system syslog host {{ syslog_server_ip }} facility all level info"
        save: true
  tags:
    - syslog
    - syslog_client

# pfSense client config: write the remote-logging block in config.xml and
# restart syslogd. pfsensible.core 0.7.x has no syslog module, so we drive
# config.xml directly via php -r (same pattern as the GW_WAN cleanup task
# in the pfsense_firewall role). Idempotent — only writes + restarts when
# config differs.
- name: Syslog client — pfSense
  hosts: pfsense
  gather_facts: false
  tasks:
    - name: Configure remote syslog server in pfSense config.xml
      ansible.builtin.shell: |
        php -r 'require_once("/etc/inc/config.inc");
                require_once("/etc/inc/system.inc");
                $target = getenv("PFS_SYSLOG_SRV");
                $cur = config_get_path("syslog", []);
                $changed = false;
                $desired = [
                  "remoteserver" => $target,
                  "ipproto"      => "ipv4",
                  "logall"       => true,
                  "enable"       => true,
                ];
                foreach ($desired as $k => $v) {
                  $existing = $cur[$k] ?? null;
                  if ($v === true) {
                    if ($existing !== true && $existing !== "yes" && $existing !== "on") {
                      $cur[$k] = true; $changed = true;
                    }
                  } else if (($existing ?? "") !== $v) {
                    $cur[$k] = $v; $changed = true;
                  }
                }
                if ($changed) {
                  config_set_path("syslog", $cur);
                  write_config("Enable remote syslog to " . $target);
                  system_syslogd_start();
                  echo "CHANGED: remote syslog enabled, server=" . $target . "\n";
                } else {
                  echo "OK: remote syslog already configured for " . $target . "\n";
                }'
      environment:
        PFS_SYSLOG_SRV: "{{ syslog_server_ip }}"
      register: pfsense_syslog_cfg
      changed_when: "'CHANGED' in pfsense_syslog_cfg.stdout"
  tags:
    - syslog
    - syslog_client

- name: splunk forwarder
  hosts: splunk-forwarder
  gather_facts: true
  become: true
  roles:
    - role: splunk-forwarder
      when: splunk_server_ip is defined
  tags:
    - splunk-forwarder

# =============================================================================
# Management plane carries NO AD traffic — enforced, not assumed
# =============================================================================
# REQUIREMENT (Eric, 2026-08-17): no range-generated AD/LDAP traffic may cross
# 10.255.240.0/20. CLAUDE.md §8 already says the management plane is
# out-of-band and invisible in-scenario; this play makes that enforceable.
#
# WHY A SECOND PASS. "Strip mgmt interface from AD DNS registration" and
# "Purge mgmt-subnet A records" both run much earlier, right after dc_status --
# and roughly thirty plays follow them, several of which reboot a DC. A DC
# re-registers its DNS records on every Netlogon start, so a purge in the
# middle of the run proves nothing about the state at the end of it.
#
# MEASURED ON A DEPLOYED RANGE 2026-08-13, with both earlier plays having run:
#
#   Get-DnsServerResourceRecord -ZoneName blackstone.mil -RRType A
#     bs-dc01  10.255.240.136
#     bs-dc02  10.255.240.178
#
#   Resolve-DnsName bs-dc01.blackstone.mil -Type A
#     172.31.2.7        <- production
#     10.255.240.136    <- management
#
# Clients round-robin across both, so roughly HALF of all Kerberos, LDAP and
# RPC traffic was crossing the management plane -- visible to trainees hunting
# in Security Onion as 10.255.240.x in authentication flows, which is
# out-of-scenario infrastructure they should not know exists. The SO dashboard
# is what surfaced it: destination.ip showed the four DC management addresses
# with counts comparable to their production ones.
#
# NOT fixing this with Netlogon's DnsAvoidRegisterRecords. The domain-level
# "same as parent" records are already clean here -- blackstone.mil resolves to
# production addresses only -- so that control addresses a problem this range
# does not have, and a wrong mnemonic would break DC locator. Purge what is
# demonstrably wrong, then assert it stayed gone.
# =============================================================================
# DNS Server query logging — the half Sysmon cannot see
# =============================================================================
# Sysmon EventCode 22 records DNS queries WITH the querying process, which is
# its unique value. What it cannot record is which server answered, the message
# type, or the record type -- those are properties of the transaction as the
# SERVER sees it. Measured 2026-08-18 on this range: DNS.message_type was
# "unknown" for 100% of events in Network_Resolution, and DNS.dest was empty,
# because no add-on can supply from Sysmon what Sysmon does not capture.
#
# WHY THE LEGACY DEBUG LOG AND NOT THE ANALYTICAL CHANNEL. The modern
# Microsoft-Windows-DNS-Server/Analytical ETW channel is the better source, but
# Splunk_TA_windows 9.0.1 ships NO input for it -- verified by unpacking the
# add-on. Its only per-query mechanism is
# [MonitorNoHandle://$WINDIR\System32\Dns\dns.log], so that is what the
# forwarder template now enables for DCs, and this play produces the file it
# reads. Using a source the installed add-on already parses beats introducing
# one nothing understands.
- name: DNS Server query logging on the domain controllers
  hosts: domain_controllers
  gather_facts: false
  tags:
    - dns_logging
    - dns
  tasks:
    # Explicit flag set, trimmed against the known-working baseline that -All
    # established. FullPackets is the important one to leave OFF: it appends a
    # full hex dump of every packet and was the bulk of the 646 KB/20s observed
    # with everything on. The summary line per packet is what
    # Splunk_TA_windows's MSAD:NT6:DNS parsing reads.
    - name: Enable DNS Server debug logging
      ansible.windows.win_powershell:
        script: |
          Set-DnsServerDiagnostics `
            -Queries $true -Answers $true -QuestionTransactions $true `
            -UnmatchedResponse $true `
            -SendPackets $true -ReceivePackets $true `
            -UdpPackets $true -TcpPackets $true `
            -FullPackets $false `
            -Notifications $false -Update $false `
            -EnableLoggingToFile $true `
            -EnableLogFileRollover $true `
            -LogFilePath '{{ dns_debug_log_path }}' `
            -MaxMBFileSize {{ dns_debug_log_max_mb }} `
            -ErrorAction Stop
          $Ansible.Changed = $true
      when: dns_debug_logging | bool

    # REPORTS BEFORE IT GATES. The first version put this after the wait, so
    # when the wait failed the state that would have explained it never
    # printed. Diagnostic output must never sit behind the assertion it exists
    # to diagnose.
    - name: Read back the resulting diagnostics state
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $d = Get-DnsServerDiagnostics
          Write-Output (($d | Format-List | Out-String).Trim())
      register: dns_diag
      changed_when: false
      when: dns_debug_logging | bool

    - name: Report diagnostics state
      ansible.builtin.debug:
        msg: "{{ (dns_diag.output[0] | default('')) .split('\n') }}"
      when: dns_debug_logging | bool

    # Guarantee there is something to log. An idle DNS server writes nothing,
    # and "no traffic" would be indistinguishable from "logging misconfigured"
    # -- the same trap the SO mirror check fell into before it generated its
    # own ICMP. Query THIS server specifically so the record must land here.
    - name: Generate DNS queries against this server so the log has content
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $me = '{{ hostvars[inventory_hostname].network_interfaces
                    | rejectattr("ipv4.address", "match", "10\.255\.(24[0-9]|25[0-5])\.")
                    | map(attribute="ipv4.address") | first }}'
          foreach ($n in @('{{ domain_name }}', 'www.voltgrid.com', 'pp-file.{{ domain_name }}')) {
            try { Resolve-DnsName -Name $n -Server $me -DnsOnly -ErrorAction SilentlyContinue | Out-Null } catch {}
          }
          Write-Output ("queried via " + $me)
      changed_when: false
      when: dns_debug_logging | bool

    - name: Wait for the DNS log file to contain records
      ansible.windows.win_stat:
        path: "{{ dns_debug_log_path }}"
      register: dns_log_stat
      # > min_bytes, not > 0. A byte-interpreted cap would hold the file under
      # ~500 bytes, so this assertion catches the unit confusion returning as
      # well as catching logging being off entirely.
      until: dns_log_stat.stat.exists and (dns_log_stat.stat.size | default(0)) > (dns_debug_log_min_bytes | int)
      retries: 6
      delay: 10
      when: dns_debug_logging | bool
      failed_when: false

    # A stale file handle is the one cause the diagnostics state cannot show:
    # DNS opened dns.log at service start, logging was enabled afterwards, and
    # the running service keeps touching the old handle without writing. The
    # fingerprint is exactly what was observed -- file present, lastwritetime
    # advancing, size 0. Restart and retry rather than telling someone to do it
    # by hand; a deploy that needs a manual command is a defect here.
    - name: Restart DNS if the log is still empty (stale handle)
      ansible.windows.win_service:
        name: DNS
        state: restarted
      when:
        - dns_debug_logging | bool
        - (dns_log_stat.stat.size | default(0)) <= (dns_debug_log_min_bytes | int)

    - name: Re-generate DNS queries after the restart
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          Start-Sleep -Seconds 10
          $me = '{{ hostvars[inventory_hostname].network_interfaces
                    | rejectattr("ipv4.address", "match", "10\.255\.(24[0-9]|25[0-5])\.")
                    | map(attribute="ipv4.address") | first }}'
          foreach ($n in @('{{ domain_name }}', 'www.voltgrid.com', 'pp-file.{{ domain_name }}')) {
            try { Resolve-DnsName -Name $n -Server $me -DnsOnly -ErrorAction SilentlyContinue | Out-Null } catch {}
          }
          Write-Output ("re-queried via " + $me)
      changed_when: false
      when:
        - dns_debug_logging | bool
        - (dns_log_stat.stat.size | default(0)) <= (dns_debug_log_min_bytes | int)

    - name: Re-check the DNS log after the restart
      ansible.windows.win_stat:
        path: "{{ dns_debug_log_path }}"
      register: dns_log_recheck
      until: dns_log_recheck.stat.exists and (dns_log_recheck.stat.size | default(0)) > (dns_debug_log_min_bytes | int)
      retries: 6
      delay: 10
      failed_when: false
      when:
        - dns_debug_logging | bool
        - (dns_log_stat.stat.size | default(0)) <= (dns_debug_log_min_bytes | int)

    - name: Report final log state
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ dns_debug_log_path }} is
          {{ (dns_log_recheck.stat.size | default(dns_log_stat.stat.size, true) | default(0)) }} bytes.
      when: dns_debug_logging | bool

    - name: Fail with the diagnostics state if the log is STILL empty
      ansible.builtin.fail:
        msg: |
          {{ inventory_hostname }}: {{ dns_debug_log_path }} is still empty after
          enabling every debug option, sending queries directly to this server,
          restarting the DNS service, and sending them again.

          Traffic and stale handles are both ruled out, so read the diagnostics
          state printed earlier in this run. If EnableLoggingToFile is True and
          every direction/transport/contents flag is True and the file is STILL
          zero bytes, then this Windows build is not honouring file-based debug
          logging and the source has to change -- see docs/splunk/ for the
          alternatives (DNS Analytical channel, or Zeek dns.log from the
          Security Onion branch, which already carries both halves of the
          transaction).
      when:
        - dns_debug_logging | bool
        - (dns_log_stat.stat.size | default(0)) <= (dns_debug_log_min_bytes | int)
        - (dns_log_recheck.stat.size | default(0)) <= (dns_debug_log_min_bytes | int)

# =============================================================================
# Management plane — stop the DNS server PUBLISHING its own mgmt address
# =============================================================================
# MEASURED 2026-08-18. The purge play below removed all three 10.255.240.x A
# records during the previous full deploy and the deploy succeeded, which means
# REMAINING was 0 at the end of it. They were back within a day, and:
#
#   Get-DnsServerResourceRecord -ZoneName voltgrid.com -RRType A
#     pp-dc01 10.255.240.109 TS=        <- EMPTY timestamp
#     pp-dc02 10.255.240.154 TS=
#     pp-dc03 10.255.240.203 TS=
#
# An empty timestamp means the record is STATIC, not dynamically registered.
# That matters because it explains why the existing fix could not work:
# RegisterThisConnectionsAddress governs DYNAMIC client registration only, and
# it is already correctly False on Ethernet0 (the mgmt NIC) on all three DCs.
# The records were never coming from the DNS client.
#
# They come from the DNS SERVER. A multihomed Windows DNS server publishes a
# host record for every address bound to it, into the zones it is authoritative
# for, as static records -- on every service start. PublishAddresses restricts
# that to a named list, and was NOT SET on any of the three DCs.
#
# This play makes the purge below a SAFETY NET rather than the mechanism. Purge
# alone was whack-a-mole: correct at the end of every deploy, wrong a day later.
- name: Management plane — restrict which addresses each DC's DNS server publishes
  hosts: domain_controllers
  gather_facts: false
  tags:
    - mgmt_dns
    - publish_addresses
  tasks:
    # Derived from host_vars rather than hardcoded: the production NIC is
    # whichever interface is NOT in the 10.255.240.0/20 management plane.
    - name: Derive this DC's production address from host_vars
      ansible.builtin.set_fact:
        dc_prod_ip: >-
          {{ network_interfaces
             | rejectattr('ipv4.address', 'match', '10\.255\.(24[0-9]|25[0-5])\.')
             | map(attribute='ipv4.address')
             | list | first | default('') }}

    # A blank result would write an empty PublishAddresses and stop the DC
    # publishing ANY host record, breaking DC locator. Fail instead.
    - name: A production address must have been identified
      ansible.builtin.assert:
        that:
          - dc_prod_ip | length > 0
        fail_msg: >-
          Could not identify a non-management address for {{ inventory_hostname }}
          from network_interfaces. Writing PublishAddresses without one would stop
          this DC publishing any host record at all and break DC locator. Check
          host_vars/{{ inventory_hostname }}.yml.

    - name: Publish only the production address, never the management one
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\DNS\Parameters
        name: PublishAddresses
        data: "{{ dc_prod_ip }}"
        type: string
      register: publish_addresses

    # The value is read when the DNS server starts, so without this the change
    # takes effect at the next reboot -- i.e. the purge below would still find
    # records this run and the play would look ineffective.
    - name: Restart DNS so PublishAddresses takes effect before the purge
      ansible.windows.win_service:
        name: DNS
        state: restarted
      when: publish_addresses.changed

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: DNS server will publish {{ dc_prod_ip }} only
          (management address withheld).

- name: Management plane — purge AD records and PROVE none remain
  hosts: pdc
  gather_facts: false
  # Shares the mgmt_dns tag with the PublishAddresses play above so
  # `--tags mgmt_dns` applies the fix AND clears the existing static records in
  # one run. Untagged, this was reachable only via a full deploy, which meant
  # the records could not be cleared without one.
  tags:
    - mgmt_dns
    - mgmt_dns_purge
  tasks:
    - name: Remove every 10.255.240.0/20 A record from {{ domain_name }}, then recount
      ansible.windows.win_powershell:
        script: |
          $zone = '{{ domain_name }}'
          function Get-MgmtA {
            Get-DnsServerResourceRecord -ZoneName $zone -RRType A -ErrorAction SilentlyContinue |
              Where-Object {
                $ip = $_.RecordData.IPv4Address.ToString()
                if ($ip -notlike '10.255.*') { return $false }
                $third = [int]($ip.Split('.')[2])
                ($third -ge 240) -and ($third -le 255)
              }
          }
          $stale = @(Get-MgmtA)
          foreach ($r in $stale) {
            Remove-DnsServerResourceRecord -ZoneName $zone -InputObject $r -Force -ErrorAction Stop
          }
          # Recount AFTER removing. Presence of a delete is not proof of
          # absence -- the whole point of this play is that something may be
          # putting them back.
          $left = @(Get-MgmtA)
          $names = ($stale | ForEach-Object { "$($_.HostName)=$($_.RecordData.IPv4Address)" }) -join ' '
          $Ansible.Changed = ($stale.Count -gt 0)
          Write-Output ("REMOVED=" + $stale.Count + " REMAINING=" + $left.Count + " " + $names)
      register: mgmt_dns_purge

    - name: Report
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ domain_name }}): {{ mgmt_dns_purge.output[0] }}"

    - name: FAIL if any management-plane A record survived the purge
      ansible.builtin.fail:
        msg: |
          {{ domain_name }} still publishes management-plane addresses after a
          purge: {{ mgmt_dns_purge.output[0] }}

          Clients resolving a DC name get both its production and its
          10.255.240.x address and round-robin between them, so roughly half of
          all Kerberos/LDAP/RPC traffic crosses the management plane. That
          violates CLAUDE.md §8 and exposes out-of-scenario infrastructure to
          anyone hunting in the SIEM.

          A record that comes BACK after being deleted is being re-registered,
          not left over. Check, on this DC:

            Get-DnsClient | Select InterfaceAlias, RegisterThisConnectionsAddress
              -> the management adapter must be False

            Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
              -> if the client setting is already False and records still
                 return, Netlogon is registering them and needs
                 DnsAvoidRegisterRecords set for the address record types.
      when: "'REMAINING=0 ' not in (mgmt_dns_purge.output[0] ~ ' ')"
