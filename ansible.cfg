[defaults]
# Vault password. The blueprint stages it on the controller image at this path
# (it does not persist across spin-ups); locally it is ./.vault_pass, gitignored.
vault_password_file = /home/simspace/.vault_pass

# Roles live in ./roles. Relative paths here resolve against the CURRENT
# DIRECTORY (deploy.sh runs from the extracted /etc/ansible without cd-ing), so
# the absolute production path is the backstop.
roles_path = ./roles:/etc/ansible/roles

inventory = hosts
host_key_checking = false
retry_files_enabled = true
retry_files_save_path = ./retry

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
